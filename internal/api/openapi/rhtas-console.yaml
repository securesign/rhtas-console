    SystemHealthResponse:
      type: object
      description: |
        Health of the RHTAS deployment and its component services.
        `securesignStatus` is the operator's own verdict for the whole deployment.
        Each entry in `services` carries detailed, per-service probe metrics derived
        from an in-process prober. Services with a reachable endpoint (rekor, fulcio,
        tsa, tuf) are actively HTTP-probed; the remaining components (ctlog, trillian)
        have no externally reachable endpoint and their availability is observed from
        the Securesign Custom Resource status conditions instead.
      properties:
        securesignStatus:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          description: |
            Overall deployment status taken from the Securesign CR `Ready` condition,
            which the operator derives from the component conditions: True -> healthy,
            False -> unhealthy, anything else (including an unreadable CR or no
            observation yet) -> unknown. It is not computed from `services`, so it can
            differ from the HTTP probe results.
          example: healthy
        securesignStatusReason:
          type: string
          nullable: true
          description: |
            Why securesignStatus is not healthy: a short description of why the
            Securesign CR could not be read (e.g. permission denied, not found, timeout),
            a missing Ready condition, or the Ready condition's status and reason. Raw
            Kubernetes errors are not exposed; they are written to the console logs.
            Null when healthy.
          example: null
        rekorStatus:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          deprecated: true
          description: Rekor status. Deprecated, kept for compatibility; use the `rekor` entry in `services`.
          example: healthy
        fulcioStatus:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          deprecated: true
          description: Fulcio status. Deprecated, kept for compatibility; use the `fulcio` entry in `services`.
          example: healthy
        ctlogStatus:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          deprecated: true
          description: CT log status. Deprecated, kept for compatibility; use the `ctlog` entry in `services`.
          example: healthy
        trillianStatus:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          deprecated: true
          description: Trillian status. Deprecated, kept for compatibility; use the `trillian` entry in `services`.
          example: healthy
        tsaStatus:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          deprecated: true
          description: TSA status. Deprecated, kept for compatibility; use the `tsa` entry in `services`.
          example: healthy
        tufStatus:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          deprecated: true
          description: TUF status. Deprecated, kept for compatibility; use the `tuf` entry in `services`.
          example: healthy
        services:
          type: array
          description: Per-service health detail.
          items:
            $ref: "#/components/schemas/ServiceHealth"
        probeIntervalSeconds:
          type: integer
          description: Interval, in seconds, between consecutive probes.
          example: 30
        windowSeconds:
          type: integer
          description: Approximate time window, in seconds, covered by the retained probe history.
          example: 3600
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the most recent probe round completed, i.e. how fresh the data is (not
            the time of this request). Null until the first round completes.
          example: "2026-03-18T12:00:00Z"
      required:
        - securesignStatus
        - securesignStatusReason
        - rekorStatus
        - fulcioStatus
        - ctlogStatus
        - trillianStatus
        - tsaStatus
        - tufStatus
        - services
        - probeIntervalSeconds
        - windowSeconds
        - updatedAt
    ServiceHealth:
      type: object
      description: Detailed health and probe metrics for a single component service.
      properties:
        name:
          type: string
          enum:
            ["rekor", "fulcio", "ctlog", "trillian", "tsa", "tuf"]
          description: Component service identifier.
          example: rekor
        status:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          description: |
            Current health status. Condition-derived failures apply immediately; HTTP
            probe failures only mark the service unhealthy after a configurable number
            of consecutive failures (PROBE_FAILURE_THRESHOLD, default 2). unknown when
            the outcome cannot be determined, e.g. the Securesign CR is unreadable or
            the condition is not reported.
          example: healthy
        probed:
          type: boolean
          description: |
            Whether this service is actively HTTP-probed. When false, status and
            history are derived from Securesign CR conditions and latency metrics
            are not available. A probed service falls back to condition samples
            while its endpoint URL is not published (or the CR is unreadable); each
            sample's `source` tells which applies.
          example: true
        endpointUrl:
          type: string
          nullable: true
          description: Probe target URL, or null when the service has no reachable endpoint.
          example: "https://rekor.example.com"
        latencyP50Ms:
          type: number
          nullable: true
          description: Median (p50) probe latency, in milliseconds, over the retained window. Null when not HTTP-probed or no samples exist.
          example: 42.5
        latencyP95Ms:
          type: number
          nullable: true
          description: 95th percentile probe latency, in milliseconds, over the retained window. Null when not HTTP-probed or no samples exist.
          example: 88.1
        meanLatencyMs:
          type: number
          nullable: true
          description: Mean probe latency, in milliseconds, over the retained window. Null when not HTTP-probed or no samples exist.
          example: 50.3
        errorRate:
          type: number
          nullable: true
          description: Fraction of failed probes (0..1) over the retained samples with a known outcome. Null when there is no such sample yet.
          example: 0
        uptimePercentage:
          type: number
          nullable: true
          description: Percentage of successful probes (0..100) over the retained samples with a known outcome. Null when there is no such sample yet.
          example: 100
        consecutiveFailures:
          type: integer
          description: Number of consecutive failing probes ending at the most recent sample. Unknown observations reset the count.
          example: 0
        lastProbe:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent probe, or null if none yet.
          example: "2026-03-18T12:00:00Z"
        lastSuccessfulProbe:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent successful probe, or null if none yet.
          example: "2026-03-18T12:00:00Z"
        lastStateChange:
          type: string
          format: date-time
          nullable: true
          description: Timestamp at which the status last changed, or null if unknown.
          example: "2026-03-18T10:00:00Z"
        probeCount:
          type: integer
          description: Number of probe samples retained in the window.
          example: 120
        probeHistory:
          type: array
          description: Retained probe samples, oldest first. Only present when the request sets `history=true`.
          items:
            $ref: "#/components/schemas/ProbeSample"
      required:
        - name
        - status
        - probed
        - errorRate
        - uptimePercentage
        - consecutiveFailures
        - probeCount
    ProbeSample:
      type: object
      description: A single probe observation.
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the probe was taken.
          example: "2026-03-18T12:00:00Z"
        status:
          type: string
          enum: ["healthy", "unhealthy", "unknown"]
          description: |
            Outcome of this observation. unknown means it could not be determined (e.g.
            the Securesign CR was unreadable or the condition was not reported) and is not
            counted as a failure.
          example: healthy
        success:
          type: boolean
          description: Shorthand for status == healthy.
          example: true
        latencyMs:
          type: number
          nullable: true
          description: Probe latency in milliseconds, or null for condition-derived samples or when no response was received.
          example: 41.2
        httpStatusCode:
          type: integer
          nullable: true
          description: HTTP status code returned by the probe, or null when not an HTTP probe or no response was received.
          example: 200
        source:
          type: string
          enum: ["http", "condition"]
          description: Origin of the sample - an active HTTP probe or a Securesign CR condition observation.
          example: http
        error:
          type: string
          nullable: true
          description: Error detail when the probe failed, otherwise null.
          example: null
      required:
        - timestamp
        - status
        - success
        - source
