openapi: 3.0.0
info:
  title: RHTAS Console API
  version: 1.0.0
  description: API for interacting with artifact trust, verification, and metadata services in the RHTAS Console.
servers:
  - url: https://api.rhtas.example.com
    description: Production server
tags:
  - name: Artifact
    description: Operations for signing and verifying artifacts
  - name: Rekor
    description: Operations for interacting with Rekor transparency log
  - name: Trust
    description: Operations for trust configuration and TUF targets
  - name: System
    description: Operations for system health and status monitoring
paths:
  /healthz:
    get:
      operationId: GetHealthz
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/v1/artifacts/verify:
    post:
      summary: Verify an artifact
      tags:
        - Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyArtifactRequest"
      responses:
        "200":
          description: Verification succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyArtifactResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Verification failed due to internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/artifacts/image:
    get:
      summary: Retrieve metadata and digest from an OCI-compliant registry
      tags:
        - Image
      parameters:
        - name: uri
          in: query
          required: true
          schema:
            type: string
            description: URI of the container image (e.g., docker.io/library/nginx:latest)
            example: docker.io/library/nginx:latest
      security:
        - basicAuth: []
      responses:
        "200":
          description: Container image metadata and digest retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageMetadataResponse"
        "400":
          description: Invalid input (e.g., malformed container image URI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Container image not found in the registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/rekor/entries/{uuid}:
    get:
      summary: Retrieve Rekor log entry by UUID
      tags:
        - Rekor
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rekor entry data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransparencyLogEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/rekor/public-key:
    get:
      summary: Get Rekor public key
      tags:
        - Rekor
      responses:
        "200":
          description: Rekor public key in PEM format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RekorPublicKey"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/artifacts/{artifact}/policies:
    get:
      summary: Get policies and attestations for an artifact
      tags:
        - Artifact
      parameters:
        - name: artifact
          in: path
          required: true
          schema:
            type: string
            example: quay.io/example/app:latest
      responses:
        "200":
          description: Policy and attestation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPolicies"
        "404":
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trust/config:
    get:
      summary: Get Fulcio and Rekor metadata from TUF targets
      description: |
        Parses the TUF targets metadata from the specified repository and returns information about
        Fulcio certificate authorities and Rekor transparency logs.
      tags:
        - Trust
      parameters:
        - name: tufRepositoryUrl
          in: query
          required: false
          schema:
            type: string
            description: URL of the TUF repository
            example: https://tuf-repo-cdn.sigstore.dev/
      responses:
        "200":
          description: Trust root data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustConfig"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trust/metadata-info:
    get:
      summary: Get TUF Metadata Info
      description: |
        Retrieves metadata information for all TUF roles (root, targets, snapshot, timestamp)
        from the trust repository. Each role includes versioning, expiration timestamps,
        and current status (e.g., valid, expiring, or expired).
      tags:
        - Trust
      parameters:
        - name: tufRepositoryUrl
          in: query
          required: false
          schema:
            type: string
            description: URL of the TUF repository
            example: https://tuf-repo-cdn.sigstore.dev/
      responses:
        "200":
          description: TUF metadata info grouped by role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataInfoResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trust/targets:
    get:
      summary: Get TUF Targets List
      description: |
        Fetches and returns the list of TUF target files from the specified repository.
      tags:
        - Trust
      parameters:
        - name: tufRepositoryUrl
          in: query
          required: false
          schema:
            type: string
            description: URL of the TUF repository
            example: https://tuf-repo-cdn.sigstore.dev/
      responses:
        "200":
          description: List of TUF target names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetsList"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trust/target:
    get:
      summary: Get TUF Target File Content
      description: |
        Fetches and returns the raw content of a specific TUF target file from the specified repository.
      tags:
        - Trust
      parameters:
        - name: tufRepositoryUrl
          in: query
          required: false
          schema:
            type: string
            description: URL of the TUF repository
            example: https://tuf-repo-cdn.sigstore.dev/
        - name: target
          in: query
          required: true
          schema:
            type: string
            description: Target filename
            example: rekor.pub
      responses:
        "200":
          description: Content of the requested TUF target file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetContent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trust/targets/certificates:
    get:
      summary: Get Certificates Information
      description: |
        Fetches and returns the list information of all targets of type certificate.
      tags:
        - Trust
      parameters:
        - name: tufRepositoryUrl
          in: query
          required: false
          schema:
            type: string
            description: URL of the TUF repository
            example: https://tuf-repo-cdn.sigstore.dev/
      responses:
        "200":
          description: List of TUF target names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateInfoList"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trust/coverage:
    get:
      summary: Get Trust Coverage
      description: |
        Returns attestation coverage for artifacts already processed by TAS.
        This endpoint is intentionally limited in scope and does not imply coverage
        of all artifacts in a registry, cluster, environment, or across multiple clusters.
      tags:
        - Trust
      responses:
        "200":
          description: Trust coverage data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustCoverageResponse"
              example:
                totalArtifacts: 1000
                attestedCount: 610
                unattestedCount: 390
                attestationPercentage: 61.0
                updatedAt: "2024-03-10T15:30:00Z"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable (MOCK_MODE not enabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/system/health:
    get:
      summary: Get System Health Status
      description: |
        Returns the health of the RHTAS deployment (Securesign CR Ready condition) and
        of each component service (rekor, fulcio, ctlog, trillian, tsa, tuf), as observed
        by the console's background prober. The summary is small; pass `history=true`
        to also receive the retained per-service probe samples.
      tags:
        - System
      operationId: GetApiV1SystemHealth
      parameters:
        - name: history
          in: query
          required: false
          description: Include the retained probe samples (`probeHistory`) for each service.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: System health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealthResponse"
              example:
                securesignStatus: unhealthy
                securesignStatusReason: "Ready=False (reason: Creating)"
                rekorStatus: healthy
                fulcioStatus: healthy
                ctlogStatus: unhealthy
                trillianStatus: healthy
                tsaStatus: healthy
                tufStatus: healthy
                probeIntervalSeconds: 30
                windowSeconds: 3600
                updatedAt: "2026-03-18T12:00:00Z"
                services:
                  - name: rekor
                    status: healthy
                    probed: true
                    endpointUrl: "https://rekor.example.com"
                    latencyP50Ms: 42.5
                    latencyP95Ms: 88.1
                    meanLatencyMs: 50.3
                    errorRate: 0
                    uptimePercentage: 100
                    consecutiveFailures: 0
                    probeCount: 120
                    lastProbe: "2026-03-18T12:00:00Z"
                    lastSuccessfulProbe: "2026-03-18T12:00:00Z"
                    lastStateChange: "2026-03-18T10:00:00Z"
                    probeHistory: # only present with history=true
                      - timestamp: "2026-03-18T12:00:00Z"
                        status: healthy
                        success: true
                        latencyMs: 41.2
                        httpStatusCode: 200
                        source: http
                  - name: ctlog
                    status: unhealthy
                    probed: false
                    endpointUrl: null
                    latencyP50Ms: null
                    latencyP95Ms: null
                    meanLatencyMs: null
                    errorRate: 1
                    uptimePercentage: 0
                    consecutiveFailures: 5
                    probeCount: 120
                    lastProbe: "2026-03-18T12:00:00Z"
                    lastSuccessfulProbe: null
                    lastStateChange: "2026-03-18T11:30:00Z"
                    probeHistory: # only present with history=true
                      - timestamp: "2026-03-18T12:00:00Z"
                        status: unhealthy
                        success: false
                        latencyMs: null
                        httpStatusCode: null
                        source: condition
                        error: "Securesign condition CTlogAvailable=False"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable (Kubernetes health service cannot be initialized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    VerifyArtifactRequest:
      type: object
      description: >
        Parameters for verifying a signed artifact or container image using Sigstore and related trust sources.
        Fields correspond to common verification inputs such as issuer expectations, trusted roots, and TUF configuration.
      properties:
        ociImage:
          type: string
          description: >
            The OCI image reference to verify.
          example: quay.io/example/app:latest
        bundle:
          type: object
          description: >
            Optional full Sigstore verification bundle (json).
            If provided, the verifier will validate this bundle directly instead of fetching an OCI image.
          nullable: true
          additionalProperties: true
        artifactDigest:
          type: string
          description: >
            Hex-encoded digest of the artifact to verify. Used when the artifact reference
            does not directly include a digest (e.g., separate file verification).
            Mandatory when using the bundle.
        artifactDigestAlgorithm:
          type: string
          default: sha256
          description: >
            Digest algorithm used to compute the artifact's digest.
            Common values: sha256, sha512.
        expectedOIDIssuer:
          type: string
          description: >
            Expected OIDC issuer for the signing certificate (Fulcio-based verification).
          example: https://accounts.google.com
          nullable: true
        expectedOIDIssuerRegex:
          type: string
          description: >
            Regular expression that the OIDC issuer must match, if exact match is not desired.
          nullable: true
        expectedSAN:
          type: string
          description: >
            Expected identity in the signing certificate's Subject Alternative Name (SAN) extension.
          example: user@example.com
          nullable: true
        expectedSANRegex:
          type: string
          description: >
            Regular expression that the SAN value must match, allowing pattern-based verification.
          nullable: true
        requireTimestamp:
          type: boolean
          default: true
          description: >
            Require that either an RFC3161 signed timestamp or a log entry integrated timestamp
            is present in the signature.
        requireCTLog:
          type: boolean
          default: true
          description: >
            Require that a Certificate Transparency (CT) log entry exists for the signing certificate.
        requireTLog:
          type: boolean
          default: true
          description: >
            Require that an Artifact Transparency (Rekor) log entry exists for the verified artifact.
        minBundleVersion:
          type: string
          description: >
            Minimum acceptable bundle version (e.g., '0.1') for verified signatures.
          example: "0.1"
          nullable: true
        tufRepoUrl:
          type: string
          description: >
            URL of a TUF repository containing the trusted root JSON file.
          example: https://tuf-repo-cdn.sigstore.dev
        predicateType:
          type: string
          description: >
            The type of the predicate for the attestation.
          example: https://example.com/attestations/build
      required:
        - ociImage
    VerifyArtifactResponse:
      type: object
      properties:
        signatures:
          type: array
          description: List of signature verification results
          items:
            $ref: "#/components/schemas/SignatureView"
        attestations:
          type: array
          description: List of attestations for the artifact
          items:
            $ref: "#/components/schemas/AttestationView"
        summary:
          description: List of attestations for the artifact
          $ref: "#/components/schemas/ArtifactSummaryView"
        artifact:
          description: Artifact metadata response
          $ref: "#/components/schemas/ImageMetadataResponse"
      required:
        - signatures
        - attestations
        - summary
        - artifact
    Verification:
      type: object
      description: Verification details for a Rekor entry, including inclusion proof and signed timestamp
      properties:
        inclusionProof:
          $ref: "#/components/schemas/InclusionProof"
          description: Merkle tree inclusion proof for the entry
        signedEntryTimestamp:
          type: string
          description: Base64-encoded signed timestamp for the entry
      required:
        - inclusionProof
        - signedEntryTimestamp
    RekorPublicKey:
      type: object
      properties:
        publicKey:
          type: string
          description: Rekor public key in PEM format
          example: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkq...\n-----END PUBLIC KEY-----"
      required:
        - publicKey
    ArtifactPolicies:
      type: object
      properties:
        artifact:
          type: string
          description: The artifact URI
        policies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Policy name
              status:
                type: string
                description: Policy status
              lastChecked:
                type: string
                format: date-time
                description: Last time the policy was checked
        attestations:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: Attestation type
              issuer:
                type: string
                description: Issuer of the attestation
              subject:
                type: string
                description: Subject of the attestation
              issuedAt:
                type: string
                format: date-time
                description: Issuance timestamp
      required:
        - artifact
        - policies
        - attestations
    TrustConfig:
      type: object
      properties:
        fulcioCertAuthorities:
          type: array
          items:
            type: object
            properties:
              subject:
                type: string
                description: Certificate authority subject
              pem:
                type: string
                description: Certificate in PEM format
                example: "-----BEGIN CERTIFICATE-----\nMIIBIjANBgkq...\n-----END CERTIFICATE-----"
            required:
              - subject
              - pem
      required:
        - fulcioCertAuthorities
    Metadata:
      type: object
      description: Metadata for a container image
      properties:
        mediaType:
          type: string
          description: Media type of the container image (e.g., OCI manifest type)
          example: application/vnd.oci.image.manifest.v1+json
        size:
          type: integer
          format: int64
          description: Size of the container image in bytes
          example: 1234
        created:
          type: string
          format: date-time
          description: Creation timestamp of the container image (if available)
          nullable: true
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value labels or annotations associated with the container image
          nullable: true
          example:
            org.opencontainers.image.version: 1.0.0
      required:
        - mediaType
        - size
    ImageMetadataResponse:
      type: object
      properties:
        image:
          type: string
          description: The container image URI
          example: docker.io/library/nginx:latest
        registry:
          type: string
          description: The registry URI of the container image
          example: index.docker.io
        metadata:
          $ref: "#/components/schemas/Metadata"
        digest:
          type: string
          description: The container image's digest (e.g., SHA256 hash)
          example: sha256:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      required:
        - artifact
        - registry
        - metadata
        - digest
    MetadataInfo:
      type: object
      properties:
        version:
          type: string
          description: Version of the TUF metadata
        expires:
          type: string
          description: Expiry date of the TUF metadata
        status:
          type: string
          description: Status of the TUF metadata (valid, expiring, expired)
      required:
        - version
        - expires
        - status
    MetadataInfoResponse:
      type: object
      properties:
        repo-url:
          type: string
          description: URL of the TUF repository
        data:
          type: object
          description: Metadata info grouped by TUF role (root, targets, snapshot, timestamp)
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/MetadataInfo"
      required:
        - data
    TargetsList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TargetInfo"
      required:
        - data
    TargetContent:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    TargetInfo:
      type: object
      properties:
        name:
          type: string
          description: Target name
        type:
          type: string
          description: Target type
        status:
          type: string
          description: Status of the target.
        content:
          type: string
          description: Content of the target.
      required:
        - name
        - type
        - status
        - content
    CertificateStatus:
      type: string
      description: >
        Status of the certificate, derived from trusted_root.json validFor window and X.509 validity.
        active — in service, cert is valid.
        expiring — in service, cert expires within 30 days.
        expired — the X.509 cert has actually expired.
        revoked — cert still valid but taken out of service.
      enum:
        - active
        - expiring
        - expired
        - revoked
    CertificateInfo:
      type: object
      properties:
        subject:
          type: string
          description: Certificate subject
        issuer:
          type: string
          description: Certificate issuer
        type:
          type: string
          description: Target type
        status:
          $ref: "#/components/schemas/CertificateStatus"
        target:
          type: string
          description: The TUF target to which the certificate is associated.
        certExpiration:
          type: string
          description: Expiration date and time of the certificate (notAfter).
        validForStart:
          type: string
          description: Start of the service window from trusted_root.json validFor (ISO 8601).
        validForEnd:
          type: string
          description: End of the service window from trusted_root.json validFor (ISO 8601). Absent if still active.
        pem:
          type: string
          description: Certificate in PEM-encoded format.
      required:
        - subject
        - issuer
        - type
        - status
        - target
        - certExpiration
        - pem
    CertificateInfoList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CertificateInfo"
      required:
        - data
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error
    CertificateRole:
      type: string
      enum:
        - leaf
        - intermediate
        - root
        - unknown
    ParsedCertificate:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/CertificateRole"
        subject:
          type: string
        issuer:
          type: string
        notBefore:
          type: string
          format: date-time
          description: ISO date string
        notAfter:
          type: string
          format: date-time
          description: ISO date string
        sans:
          type: array
          items:
            type: string
        serialNumber:
          type: string
          nullable: true
        isCa:
          type: boolean
        pem:
          type: string
      required:
        - role
        - subject
        - issuer
        - notBefore
        - notAfter
        - sans
        - isCa
        - pem
    SignatureView:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the signature view
        digest:
          type: string
        signingCertificate:
          $ref: "#/components/schemas/ParsedCertificate"
        certificateChain:
          type: array
          items:
            $ref: "#/components/schemas/ParsedCertificate"
        rekorEntry:
          $ref: "#/components/schemas/TransparencyLogEntry"
          description: Rekor transparency log entry
          additionalProperties: true
        rawBundleJson:
          type: string
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        signatureStatus:
          $ref: "#/components/schemas/signatureStatus"
      required:
        - id
        - digest
        - signingCertificate
        - certificateChain
        - rawBundleJson
        - signatureStatus
    AttestationView:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the signature view
        digest:
          type: string
        signingCertificate:
          $ref: "#/components/schemas/ParsedCertificate"
        certificateChain:
          type: array
          items:
            $ref: "#/components/schemas/ParsedCertificate"
        type:
          type: string
        rekorEntry:
          $ref: "#/components/schemas/TransparencyLogEntry"
          description: Rekor transparency log entry
          additionalProperties: true
        rawBundleJson:
          type: string
        rawStatementJson:
          type: string
        predicateType:
          type: string
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        payloadType:
          type: string
        attestationStatus:
          $ref: "#/components/schemas/attestationStatus"
      required:
        - id
        - digest
